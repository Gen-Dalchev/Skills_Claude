name: Исполнитель (общий)

# Общий workflow исполнителя конвейера «Штаб» (Ш-33): проект вызывает его
# коротким файлом по метке «готово» — условия запуска и права задаёт он.
# Метка только будит очередь (Ш-41, Ш-42): слоты — в queue.yml, их же
# будит слияние PR через resolver.yml (Ш-97); после очереди — развязчик.
# Правка этого файла меняет исполнителя во всех проектах сразу.

on:
  workflow_call:
    inputs:
      node-version:
        description: Версия Node; пусто — Node не ставится
        type: string
        default: ""
      chrome:
        description: Готовить Chrome для прогона в браузере
        type: boolean
        default: false
      project-tools:
        description: Команды проекта, которые агенту можно запускать
        type: string
        default: "Bash(npm ci),Bash(npm test:*),Bash(npm run:*)"
      model:
        type: string
        default: claude-opus-5-5
      effort:
        type: string
        default: high
      max-turns:
        type: number
        default: 100
      big-turns:
        description: Предел ходов задачи с меткой «крупная» (Ш-46)
        type: number
        default: 200
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  executor:
    # Один исполнитель на репо, как его ни разбудили — меткой или слиянием
    # (Ш-97): группа «queue» общая с очередью по слиянию (resolver.yml); следующий ждёт, а не отменяет.
    # Группа — на весь вызов, не на слоты: слот, ждущий группу, отменил бы
    # ждущий прогон с другого пути.
    concurrency:
      group: queue
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Владелец — буквально: здесь GitHub выражений не принимает. После форка
    # заменить на свой (гайд агентов, docs/гайд-агентов.md; Ш-134).
    uses: goigolden88/Skills_Claude/.github/workflows/queue.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      chrome: ${{ inputs.chrome }}
      project-tools: ${{ inputs.project-tools }}
      model: ${{ inputs.model }}
      effort: ${{ inputs.effort }}
      max-turns: ${{ inputs.max-turns }}
      big-turns: ${{ inputs.big-turns }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # После очереди — тот же развязчик, что и по слиянию (Ш-51): PR, открытый
  # после слияния, с которым он конфликтует, иначе никто не развяжет —
  # развязчик зовётся только слиянием, а «Проверки PR» на PR с конфликтом
  # не запускаются, и ревьюер его не видит (DeluVremya#51, 07.10). Без
  # конфликтов — только поиск, без Claude. Группа «resolver» общая с
  # развязчиком проекта: два сразу не идут.
  resolver:
    needs: executor
    if: ${{ !cancelled() }}
    concurrency:
      group: resolver
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Владелец — буквально: здесь GitHub выражений не принимает. После форка
    # заменить на свой (гайд агентов, docs/гайд-агентов.md; Ш-134).
    uses: goigolden88/Skills_Claude/.github/workflows/resolver.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      chrome: ${{ inputs.chrome }}
      project-tools: ${{ inputs.project-tools }}
      # Очередь только что прошла — второй раз не будить (Ш-97).
      wake-queue: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
