name: Напоминания

# Сроки токенов и свежесть клонов: раз в неделю — задачи владельцу
# в этом репо. Без Claude и без своих секретов: только GITHUB_TOKEN.
on:
  schedule:
    - cron: "17 4 * * 1"   # понедельник, 09:17 UTC+5
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create напоминание --color FBCA04 --description "Сроки токенов, клоны" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          python3 scripts/reminders.py
